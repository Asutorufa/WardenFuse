name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch/PR cancels the superseded run (macOS runners are scarce).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  rust:
    name: rust (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # Toolchain version comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Format (WardenFuse crates; vendored crates keep upstream formatting)
        run: cargo fmt -p wardenfuse-core -p wardenfuse-nmh --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (no Bitwarden account needed; uses system OpenSSH tools)
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked

  android:
    name: Android (unit tests, lint, debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests, lint, and build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v5
        with:
          name: WardenFuse-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  app:
    runs-on: macos-26
    needs: rust
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Swift tests (authentication coordinator, mocked LocalAuthentication)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin -p wardenfuse-core
          mkdir -p target/universal-apple-darwin/release
          cp target/aarch64-apple-darwin/release/libwardenfuse_core.a target/universal-apple-darwin/release/
          swift test --package-path macos --arch arm64
      - name: Build universal WardenFuse.app (arm64 + x86_64, ad-hoc signed) and DMG
        env:
          DMG: "1"
        run: |
          # Keep the app's CFBundleShortVersionString in sync with the release tag.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          scripts/build-app.sh
      - uses: actions/upload-artifact@v5
        with:
          name: WardenFuse-ad-hoc
          path: dist/WardenFuse.dmg

  # Tag releases reuse the ad-hoc signed DMG built and tested by the app job.
  # No Apple Developer account, certificate, or notarization credentials are needed.
  release:
    name: Publish ad-hoc macOS release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: app
    permissions:
      contents: write
    steps:
      - name: Download ad-hoc DMG
        uses: actions/download-artifact@v5
        with:
          name: WardenFuse-ad-hoc
          path: dist
      - name: Generate SHA-256 checksum
        run: |
          cd dist
          sha256sum WardenFuse.dmg > WardenFuse.dmg.sha256
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WardenFuse.dmg
            dist/WardenFuse.dmg.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Universal macOS app (Apple Silicon + Intel), signed ad-hoc without an
            Apple Developer certificate. This build is **not notarized**.

            After copying WardenFuse.app to Applications, macOS Gatekeeper may
            block the first launch. Try opening it, then use System Settings →
            Privacy & Security → Open Anyway to allow this app.
